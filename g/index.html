<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תהילים בקבוצה</title>
<meta property="og:title" content="תהילים בקבוצה">
<meta property="og:description" content="כל אחד מקבל פרק אחר, ויחד משלימים את ספר תהילים. קוראים ישר מהדפדפן.">
<style>
  @font-face { font-family: EzraSIL; src: url(EzraSIL.ttf) format('truetype'); font-display: swap; }
  :root { --bg: #FBF8F1; --card: #FFFFFF; --text: #1D1B16; --muted: #6B655A; --border: #E4DED0; --accent: #1F3A5F; --on-accent: #FFFFFF; --finish: #2E7D32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161A; --card: #1D2026; --text: #ECE8DF; --muted: #A39D91; --border: #2D3139; --accent: #8DB3E2; --on-accent: #14161A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; }
  .brand { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .second { display: block; font-size: 0.82em; font-weight: 400; opacity: 0.8; }
  .count .second { font-size: 11px; }
  .muted { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .center { text-align: center; margin: 24px 0; }
  .thanks { text-align: center; font-size: 20px; font-weight: 700; margin: 8px 0 12px; }
  .counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .count { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px; text-align: center; }
  .count b { display: block; font-size: 18px; }
  .count span { color: var(--muted); font-size: 12px; }
  .track { height: 6px; border-radius: 3px; background: var(--border); margin-top: 12px; overflow: hidden; }
  .bar { height: 6px; background: var(--accent); }
  h2 { color: var(--accent); font-size: 17px; font-weight: 700; margin: 14px 0 4px; }
  .perek { direction: rtl; text-align: right; font-family: EzraSIL, serif; font-size: 22px; line-height: 1.8; margin: 0 0 16px; overflow-wrap: break-word; }
  .perek b { color: var(--accent); font-size: 13px; font-family: system-ui, sans-serif; }
  button, a.btn { display: block; width: 100%; font: inherit; text-align: center; text-decoration: none; cursor: pointer; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; background: var(--card); color: var(--text); }
  button.finish { background: var(--finish); border-color: var(--finish); color: #fff; font-weight: 700; }
  button.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  button:disabled { opacity: 0.6; }
  .error { color: #C0392B; font-size: 14px; text-align: center; margin: 0 0 8px; }
  footer { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <p class="brand" id="brand">תהילים בקבוצה</p>
  <div id="screen"><p class="center">טוען…</p></div>
  <footer id="footer" hidden></footer>
  <noscript><p class="center">כדי לקרוא צריך לאפשר JavaScript בדפדפן.</p></noscript>
</main>
<script type="module" src="group.js"></script>
</body>
</html>
